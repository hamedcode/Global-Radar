<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رصد جهانی | اقتصاد، کریپتو، تکنولوژی</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@33.003/misc/Farsi-Digits/Vazirmatn-FD-font-face.css" rel="stylesheet">
<style>
  :root{
    --navy:#0b1f3a; --red:#c20017; --bg:#f4f5f7; --border:#e2e8f0; --text:#111827; --sub:#4b5563;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Vazirmatn FD",sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--navy);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}
  header h1{margin:0;font-size:1.15rem}
  header p{margin:4px 0 0;font-size:.8rem;opacity:.75}
  .market{display:flex;gap:14px;padding:10px 16px;background:#001a35;color:#fff;font-size:.8rem;flex-wrap:wrap}
  .tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:9}
  .tab{white-space:nowrap;padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:.85rem}
  .tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  main{max-width:760px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .card img{width:100%;height:160px;object-fit:cover;display:block}
  .card-body{padding:14px}
  .badges{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .badge{font-size:.7rem;padding:3px 8px;border-radius:999px;font-weight:700}
  .badge.cat{background:#e8f0fe;color:var(--navy)}
  .badge.urg{background:#fdecea;color:var(--red)}
  .card h3{margin:0 0 8px;font-size:1rem;line-height:1.5}
  .card p{margin:0 0 4px;font-size:.88rem;color:var(--sub);line-height:1.6}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.75rem;color:#9ca3af}
  .meta a{color:var(--navy);text-decoration:none;font-weight:700}
  .empty{text-align:center;padding:40px 16px;color:var(--sub)}
</style>
</head>
<body>

<header>
  <h1>🌐 رصد جهانی</h1>
  <p>مهم‌ترین اخبار اقتصاد، کریپتو و تکنولوژی جهان</p>
</header>

<div class="market" id="marketBar">در حال بارگذاری قیمت‌ها...</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-cat="all">همه</div>
  <div class="tab" data-cat="اقتصاد">📊 اقتصاد</div>
  <div class="tab" data-cat="کریپتو">🪙 کریپتو</div>
  <div class="tab" data-cat="تکنولوژی">💻 تکنولوژی</div>
</div>

<main id="feed">
  <div class="empty">در حال بارگذاری اخبار...</div>
</main>

<script>
let allNews = [];
let activeCat = 'all';

function timeAgo(ts){
  const diff = Math.floor(Date.now()/1000 - ts);
  if(diff < 3600) return Math.floor(diff/60) + ' دقیقه پیش';
  if(diff < 86400) return Math.floor(diff/3600) + ' ساعت پیش';
  return Math.floor(diff/86400) + ' روز پیش';
}

function render(){
  const feed = document.getElementById('feed');
  const items = activeCat === 'all' ? allNews : allNews.filter(n => n.category === activeCat);
  if(!items.length){
    feed.innerHTML = '<div class="empty">فعلاً خبری در این دسته نیست.</div>';
    return;
  }
  feed.innerHTML = items.map(n => `
    <div class="card">
      <img src="${n.image}" alt="" loading="lazy" onerror="this.style.display='none'">
      <div class="card-body">
        <div class="badges">
          <span class="badge cat">${n.category || ''}</span>
          <span class="badge urg">اهمیت ${n.urgency}/10</span>
        </div>
        <h3>${n.title_fa}</h3>
        ${(n.summary || []).map(s => `<p>${s}</p>`).join('')}
        <div class="meta">
          <span>${n.source} · ${timeAgo(n.timestamp)}</span>
          <a href="${n.url}" target="_blank" rel="noopener">مشاهده منبع ←</a>
        </div>
      </div>
    </div>
  `).join('');
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeCat = tab.dataset.cat;
    render();
  });
});

fetch('news.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => { allNews = data; render(); })
  .catch(() => {
    document.getElementById('feed').innerHTML = '<div class="empty">خطا در بارگذاری اخبار.</div>';
  });

fetch('market.json?t=' + Date.now())
  .then(r => r.json())
  .then(m => {
    document.getElementById('marketBar').innerHTML =
      `💵 دلار: ${m.usd_irt || '—'} &nbsp;|&nbsp; 🪙 سکه: ${m.coin_irt || '—'} &nbsp;|&nbsp; ₿ بیت‌کوین: ${m.btc || '—'} &nbsp;|&nbsp; Ξ اتریوم: ${m.eth || '—'} &nbsp;|&nbsp; ₮ تتر: ${m.usdt_irt || '—'} &nbsp;|&nbsp; بروزرسانی: ${m.updated || '--:--'}`;
  })
  .catch(() => {
    document.getElementById('marketBar').textContent = 'قیمت‌ها در دسترس نیست.';
  });
</script>

</body>
</html>
