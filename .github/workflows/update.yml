name: Global Radar Update

on:
  schedule:
    # 4 runs/day, timed to land inside the 4 Tehran digest windows (08/13/17/21):
    - cron: '30 4 * * *'   # 04:30 UTC = 08:00 Tehran
    - cron: '30 8 * * *'   # 08:30 UTC = 12:00 Tehran
    - cron: '30 13 * * *'  # 13:30 UTC = 17:00 Tehran
    - cron: '30 17 * * *'  # 17:30 UTC = 21:00 Tehran
  workflow_dispatch:
    inputs:
      manual_url:
        description: 'Paste a specific News URL to process (leave empty for normal mode)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Radar Script
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          MANUAL_URL: ${{ inputs.manual_url }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GlobalRadarBot"
          git config --global user.email "bot@noreply.github.com"
          git add news.json market.json schedule_state.json config.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news feed" && git push)
