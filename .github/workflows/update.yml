name: Global Radar Update

on:
  schedule:
    - cron: '0 * * * *'  # runs every hour; digest is only SENT inside 4 fixed Tehran slots
  workflow_dispatch:
    inputs:
      manual_url:
        description: 'Paste a specific News URL to process (leave empty for normal mode)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Radar Script
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          MANUAL_URL: ${{ inputs.manual_url }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GlobalRadarBot"
          git config --global user.email "bot@noreply.github.com"
          git add news.json market.json schedule_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update news feed" && git push)
